<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecco un nuovo esercizio</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Esercizio: Usare Grid per creare il layout di una calcolatrice</h1>

        <div class="display">
            <input type="text" placeholder="" />
            <button class="btn-clear">C</button>
            <button class="btn-delete">←</button>
            <button class="btn-percent">%</button>
            <button class="btn-operator">/</button>
            <button class="btn-operator">*</button>
            <button class="btn__">7</button>
            <button class="btn__">8</button>
            <button class="btn__">9</button>
            <button class="btn-negate">+/-</button>
            <button class="btn-operator">-</button>
            <button class="btn__">4</button>
            <button class="btn__">5</button>
            <button class="btn__">6</button>
            <button class="btn-operator">+</button>
            <button class="btn__">1</button>
            <button class="btn__">2</button>
            <button class="btn__">3</button>
            <button class="btn-equals">=</button>
            <button class="btn-zero">0</button>
            <button class="btn_virgola">.</button>
        </div>
    </div>

</body>

</html>
