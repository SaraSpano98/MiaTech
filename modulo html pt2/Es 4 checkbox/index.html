<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esercizio di input</title>
</head>
<body>
    <h1>Aggiunta di un checkbox </h1>
    <div>
        <input type="radio" id="Maschio" name="Genere" value="Maschio">
        <label for="Maschio">Maschio</label><br>
        <input type="radio" id="Femmina" name="Genere" value="Femmina">
        <label for="Femmina">Femmina</label><br>
        <input type="checkbox" id="condizioni di privacy e policy" name="condizioni di privacy e policy" value="Dati privati">
        <label for="">Sì, accetto di aver letto le condizioni di privacy e policy</label>
    </div>
</body>
</html>
