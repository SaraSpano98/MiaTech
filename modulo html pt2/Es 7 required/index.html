<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esercizio sul Required</title>
</head>
<body>
    <h1>Modulo di Registrazione</h1>
  <form action="/submit" method="post">

    <!-- Campo per il Nome -->
    <div>
      <label for="nome">Nome:</label>
      <input type="text" id="nome" name="nome" placeholder="Inserisci il tuo nome" required aria aria-required="true">
    </div>
    
    <!-- Campo per il Cognome -->
    <div>
      <label for="cognome">Cognome:</label>
      <input type="text" id="cognome" name="cognome" placeholder="Inserisci il tuo cognome" required aria aria-required="true">
    </div>
    
    <!-- Pulsante di invio -->
    <div>
      <button type="submit">Invia</button>
    </div>
  </form>
</body>
</html>
