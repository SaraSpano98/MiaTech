<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esercizio sull'Action e Metodo</title>
</head>
<body>
    <h1>Modulo di Registrazione</h1>
  <form action="processa-dati.php" method="post">

    <!-- Nome -->
    <div>
      <label for="nome">Nome:</label>
      <input type="text" id="nome" name="nome" required><br>
    </div>
    
    <!-- Cognome -->
    <div>
      <label for="cognome">Cognome:</label>
      <input type="text" id="cognome" name="cognome" required><br>
    </div>
    
    <!-- Email-->
    <div>
        <label for="email">Email:</label>
        <input type="email" id="cognome" name="email" required><br>
      </div>

    <!-- Messaggio-->
    <div>
       <label for="messaggio">Messaggio:</label>
       <textarea id="messaggio" name="messaggio" rows="4" required> </textarea><br>
    </div>

    <!-- Pulsante di invio -->
    <div>
      <button type="submit">Invia</button>
    </div>
  </form>
</body>
</html>
