<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flex Wrap Layout (Esempio 2)</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-gray-100 p-6">

  <!-- Contenitore flessibile con wrap -->
  <div class="flex flex-wrap gap-4">
    
    <!-- Elementi del layout -->
    <div class="bg-white p-4 rounded shadow w-60">
      <h2 class="font-semibold text-gray-800">Box 1</h2>
      <p class="text-sm text-gray-600">Contenuto del box 1</p>
    </div>

    <div class="bg-white p-4 rounded shadow w-60">
      <h2 class="font-semibold text-gray-800">Box 2</h2>
      <p class="text-sm text-gray-600">Contenuto del box 2</p>
    </div>

    <div class="bg-white p-4 rounded shadow w-60">
      <h2 class="font-semibold text-gray-800">Box 3</h2>
      <p class="text-sm text-gray-600">Contenuto del box 3</p>
    </div>

    <div class="bg-white p-4 rounded shadow w-60">
      <h2 class="font-semibold text-gray-800">Box 4</h2>
      <p class="text-sm text-gray-600">Contenuto del box 4</p>
    </div>

    <div class="bg-white p-4 rounded shadow w-60">
      <h2 class="font-semibold text-gray-800">Box 5</h2>
      <p class="text-sm text-gray-600">Contenuto del box 5</p>
    </div>

  </div>

</body>
</html>
