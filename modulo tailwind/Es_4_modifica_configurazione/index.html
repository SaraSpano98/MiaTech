<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuovo Esercizio</title>
    <script>
        tailwind.config = {
          theme: {
            extend: {
              colors: {
                primary: '#1E40AF', // blu personalizzato
                secondary: '#FBBF24', // giallo personalizzato
              },
              spacing: {
                '72': '18rem',
                '84': '21rem',
                '96': '24rem',
              },
            }
          }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <div class="container mx-auto px-4 py-10 bg-white text-black rounded-xl shadow-md">
        <h1 class="text-3xl font-bold text-center mb-6">Benvenuto!</h1>
        <p class="text-lg text-center">Qui abbiamo usato un colore di sfondo personalizzato con Tailwind!</p>
    </div>
</body>
</html>
