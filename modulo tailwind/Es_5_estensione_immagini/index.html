<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuovo Esercizio</title>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          spacing: {
            '128': '32rem',
            '144': '36rem',
            '160': '40rem'
          },
        }
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
  <div class="container mx-auto bg-white rounded-xl shadow-md mt-144 p-160">
    <h1 class="text-4xl font-bold text-center mb-10">Spaziatura Personalizzata</h1>
    <p class="text-center text-lg text-gray-700">Questo contenitore ha un margine superiore di 36rem e padding interno
      di 40rem grazie alle dimensioni personalizzate</p>
  </div>
</body>

</html>

//mt-144: margin-top: 36rem
//p-160: padding: 40rem su tutti i dati
